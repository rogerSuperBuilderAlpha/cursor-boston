version = 1
SPDX-PackageName = "cursor-boston"
SPDX-PackageDownloadLocation = "https://github.com/rogerSuperBuilderAlpha/cursor-boston"

# Project-wide default: every source file is GPL-3.0-only under Cursor Boston's
# copyright. Files that have an inline `SPDX-License-Identifier` header
# override this default; the bulk of the codebase will rely on this declaration
# until the one-time backfill script runs (see scripts/add-gpl-headers.js
# header comment and REVIEW_ACTION_PLAN.md Phase 5.5.4).
[[annotations]]
path = ["**.ts", "**.tsx", "**.js", "**.jsx", "**.mjs", "**.cjs"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Cursor Boston"
SPDX-License-Identifier = "GPL-3.0-only"

# Documentation, markdown, configuration. Same license; covered separately
# so the file-glob is explicit.
[[annotations]]
path = ["**.md", "**.json", "**.yml", "**.yaml", "**.toml"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Cursor Boston"
SPDX-License-Identifier = "GPL-3.0-only"

# Python (scripts/, notebooks) and Marimo notebooks. PyData hackathon
# submissions live in pydata-2026-submissions/ and have their own
# contributor-copyright annotation below.
[[annotations]]
path = ["**.py", "**.ipynb"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Cursor Boston"
SPDX-License-Identifier = "GPL-3.0-only"

# Shell scripts, husky hooks, and CSS.
[[annotations]]
path = ["**.sh", "**.bash", "**.css", "**.scss", ".husky/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Cursor Boston"
SPDX-License-Identifier = "GPL-3.0-only"

# Static assets under public/ — project-original logos, screenshots, QR codes,
# and metadata. Any third-party font, icon set, or vendored image added later
# MUST be annotated individually (e.g. inline `.license` companion file or
# a more-specific entry in this file).
[[annotations]]
path = [
    "public/**",
    "**.svg",
    "**.png",
    "**.jpg",
    "**.jpeg",
    "**.gif",
    "**.ico",
    "**.webp",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Cursor Boston"
SPDX-License-Identifier = "GPL-3.0-only"

# Data fixtures, plain-text content, Firestore rules, and Cursor MDC files.
[[annotations]]
path = ["**.csv", "**.txt", "**.rules", "**.mdc"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Cursor Boston"
SPDX-License-Identifier = "GPL-3.0-only"

# Dotfiles, tool config, lockfiles, CODEOWNERS. Generated and tool-config
# files don't carry meaningful authorship but REUSE still requires coverage.
[[annotations]]
path = [
    ".gitignore",
    ".gitattributes",
    ".mailmap",
    ".nvmrc",
    ".dockerignore",
    ".editorconfig",
    ".firebaserc",
    ".gitleaks.toml",
    ".github-usernames",
    ".github/CODEOWNERS",
    ".env.local.example",
    ".env.local.demo",
    "package-lock.json",
    "cursor-boston.code-workspace",
    "next-env.d.ts",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Cursor Boston"
SPDX-License-Identifier = "GPL-3.0-only"

# Dockerfiles (no file extension, so a name-based pattern is required).
[[annotations]]
path = ["**/Dockerfile", "**/Dockerfile.*", "Dockerfile"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Cursor Boston"
SPDX-License-Identifier = "GPL-3.0-only"

# Hackathon submissions — copyright belongs to individual contributors who
# signed off under the DCO (GPL-3.0-only inbound license). Aggregated under
# a project-level credit line; the git history is authoritative for
# per-file authorship.
[[annotations]]
path = ["pydata-2026-submissions/**", "hack-a-sprint-2026-submissions/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Cursor Boston hackathon contributors"
SPDX-License-Identifier = "GPL-3.0-only"

# Generated artifacts — excluded from license tracking. CycloneDX SBOMs
# (generated per release) and the autogenerated OpenAPI spec aren't
# hand-authored; the LICENSE file at the repo root governs the project
# itself, and downstream consumers should look there rather than at
# per-file annotations on these.
[[annotations]]
path = ["public/openapi.json", "docs/API.md", "public/llms.txt"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Cursor Boston"
SPDX-License-Identifier = "GPL-3.0-only"
